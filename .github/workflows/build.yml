name: Build Cubes OS kernel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup target add aarch64-unknown-none
      - name: Build kernel ELF
        run: cargo build --release
      - name: Inspect ELF
        run: |
          file target/aarch64-unknown-none/release/cubes-os
          llvm-readelf -h target/aarch64-unknown-none/release/cubes-os || readelf -h target/aarch64-unknown-none/release/cubes-os
      - name: Upload kernel build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubes-os-kernel-elf
          path: target/aarch64-unknown-none/release/cubes-os
          if-no-files-found: error
